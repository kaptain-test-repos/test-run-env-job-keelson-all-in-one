apiVersion: v1
kind: Secret
metadata:
  # Supplied templates MUST be checksum named or the build fails; the build's
  # checksum pass resolves the suffix from the input set.
  name: ${ProjectName}-env-secret-checksum
type: Opaque
stringData:
  api-token: "${EnvApiToken}"
  environmentPassphrase: "${RunEnvJobKeelsonAllInOne/EnvironmentPassphrase}"
